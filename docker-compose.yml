
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hubtal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hubtal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hubtal?schema=public
    command: ["npm", "run", "db:setup"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hubtal?schema=public
    ports:
      - "3001:3001"
    depends_on:
      backend-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:3001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: